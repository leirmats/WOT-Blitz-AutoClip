name: Windows build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build BlitzHangar tank database
        run: python build_tanks.py

      - name: Download FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build_tools | Out-Null
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile build_tools/ffmpeg.zip
          Expand-Archive -Force build_tools/ffmpeg.zip build_tools/ffmpeg_extract
          $f = Get-ChildItem -Recurse build_tools/ffmpeg_extract -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $f.FullName build_tools/ffmpeg.exe
      - name: Install Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          New-Item -ItemType Directory -Force build_tools/tesseract | Out-Null
          Copy-Item "C:\Program Files\Tesseract-OCR\tesseract.exe" build_tools/tesseract/tesseract.exe
          Copy-Item "C:\Program Files\Tesseract-OCR\*.dll" build_tools/tesseract/
          Copy-Item "C:\Program Files\Tesseract-OCR\tessdata" build_tools/tesseract/ -Recurse
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name WoT_Blitz_AutoClip --collect-all tkinterdnd2 --add-binary "build_tools\ffmpeg.exe;." --add-data "tank_data.json;." app.py
      - name: Package tank database next to EXE
        shell: pwsh
        run: Copy-Item tank_data.json dist/tank_data.json
      - uses: actions/upload-artifact@v4
        with:
          name: WoT_Blitz_AutoClip-Windows-x64
          path: |
            dist/WoT_Blitz_AutoClip.exe
            dist/tank_data.json
